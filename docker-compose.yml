services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capitalmetal_backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/php-uploads.ini
      - ./docker/start.sh:/start.sh
    ports:
      - "8010:8000"
    command: /start.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=capital_metal
      - DB_USERNAME=root
      - DB_PASSWORD=root

  db:
    image: mysql:8.0
    container_name: capitalmetal_db
    restart: always
    environment:
      MYSQL_DATABASE: capital_metal
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: capitalmetal_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://capital-metal.first-link-logistics.com/phpmyadmin/
    ports:
      - "8081:80"
    depends_on:
      - db

  frontend:
    image: node:22
    container_name: capitalmetal_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app

  flfl_frontend_web:
    image: nginx:alpine
    container_name: flfl_frontend_web
    restart: always
    volumes:
      - /home/ubuntu/FLFL-Design/frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

  capital_frontend_web:
    image: nginx:alpine
    container_name: capital_frontend_web
    restart: always
    volumes:
      - /home/ubuntu/Capital-Metal/frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "8091:80"

volumes:
  db_data:
