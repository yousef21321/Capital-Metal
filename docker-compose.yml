services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capitalmetal_backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-uploads.ini:/usr/local/etc/php/conf.d/php-uploads.ini
      - ./docker/start.sh:/start.sh
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: /start.sh
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=capital_metal
      - DB_USERNAME=capital-metal
      - DB_PASSWORD=f5SDN61DN3rGk6ZiDnHU

  db:
    image: mysql:8.0
    container_name: capitalmetal_db
    restart: always
    environment:
      MYSQL_DATABASE: capital_metal
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: capitalmetal_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: https://capital-metal.com/phpmyadmin/
    ports:
      - "8080:80"
    depends_on:
      - db

  frontend:
    image: node:22
    container_name: capitalmetal_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app

volumes:
  db_data:
