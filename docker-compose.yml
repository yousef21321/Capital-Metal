services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flfl_backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: /start.sh
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=flfl_design
      - DB_USERNAME=root
      - DB_PASSWORD=root

  db:
    image: mysql:8.0
    container_name: flfl_db
    restart: always
    environment:
      MYSQL_DATABASE: flfl_design
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: flfl_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db

  frontend:
    image: node:22
    container_name: flfl_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - app

volumes:
  db_data:
