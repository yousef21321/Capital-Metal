server {
    listen 80;
    server_name flfl-design.com;

    # ─── Root: built Vue SPA output (from `npm run build` → frontend/dist/) ─
    root /var/www/spa;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    # ─── API routes → Laravel backend ────────────────────────────────
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # ─── Storage (Laravel public disk) ───────────────────────────────
    # Served directly for performance + CF caching (no cookies, no PHP)
    location /storage/ {
        alias /home/ubuntu/FLFL-Design/backend/storage/app/public/;

        fastcgi_hide_header Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header Cache-Control "public, max-age=31536000, immutable";

        access_log off;
        log_not_found off;
        expires 30d;
    }

    # ─── Product pages → ALL go through Laravel ─────────────────────
    # SeoController detects bots via User-Agent and returns:
    #   - Bots:  HTML with og:image, og:title, og:description (200 OK)
    #   - Humans: 418 status → Nginx falls back to serving the SPA
    location ~ ^/products/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 418 = /index.html;
    }

    # ─── SPA fallback ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Static assets with long cache ──────────────────────────────
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Laravel PHP processing ──────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ─── Security ────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
